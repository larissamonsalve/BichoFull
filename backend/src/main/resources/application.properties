# Conexão com o MySQL do Docker
spring.datasource.url=jdbc:mysql://localhost:3306/db_bichofull?createDatabaseIfNotExist=true
spring.datasource.username=monsalve
spring.datasource.password=9202
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações de Engenharia de Software (Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Ativando o Flyway
spring.flyway.enabled=true
# Se o banco estiver vazio, o Flyway cria a tabela de histórico
spring.flyway.baseline-on-migrate=true

# Habilita a funcionalidade de limpeza - para não limpar TRUE
spring.flyway.clean-disabled=true

spring.flyway.user=monsalve
spring.flyway.password=9202

# Configuração do Token JWT
api.security.token.secret=${JWT_SECRET:BichoFullSecretKeyMuitoSeguraParaGerarOJWT2026!}