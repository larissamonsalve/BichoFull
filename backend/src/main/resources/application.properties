# Conexão com o MySQL do Docker forçando UTC para consistência
spring.datasource.url=jdbc:mysql://db:3306/db_bichofull?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:monsalve}
spring.datasource.password=${DB_PASS:9202}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações de Engenharia de Software (Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Ativando o Flyway
spring.flyway.enabled=true
# Se o banco estiver vazio, o Flyway cria a tabela de histórico
spring.flyway.baseline-on-migrate=true

# Habilita a funcionalidade de limpeza - para não limpar TRUE
spring.flyway.clean-disabled=true

spring.flyway.user=${DB_USER:monsalve}
spring.flyway.password=${DB_PASS:9202}

# Configuração do Token JWT
api.security.token.secret=${JWT_SECRET:B1ch0Full_2026_Secur1ty_K3y_Padrao_Forte_Sem_Caracteres_Estranhos}
