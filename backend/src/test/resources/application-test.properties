# Força o uso do H2 e ignora o MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialeto correto para o H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Garante que o Flyway também use o H2
spring.flyway.enabled=true
spring.flyway.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.flyway.user=sa
spring.flyway.password=

# Propriedade do JWT (Obrigatória para o Service não dar erro)
api.security.token.secret=BichoFullSecretKeyMuitoSeguraComMaisDe32Caracteres2026!