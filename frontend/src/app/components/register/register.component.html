<div class="register-container">
  <h2>Criar Conta</h2>

  @if (successMessage) {
    <div class="alert success">{{ successMessage }}</div>
  }
  @if (errorMessage) {
    <div class="alert error">{{ errorMessage }}</div>
  }

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Nome Completo</label>
      <input id="name" type="text" formControlName="name" placeholder="Digite seu nome" />
    </div>

    <div class="form-group">
      <label for="username">Nome de Usuário</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        placeholder="Escolha um apelido"
      />
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" placeholder="seu@email.com" />
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Mínimo 6 caracteres"
      />
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Cadastrar</button>
  </form>
</div>
