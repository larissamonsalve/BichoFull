<div class="arcade-page-wrapper">
  <header class="arcade-header-login">
    <a routerLink="/" class="arcade-logo-link">
      <h1 class="arcade-logo">BichoFull</h1>
    </a>
    <p class="arcade-subtitle">Sistema de Simulação do Jogo do Bicho</p>
  </header>

  <div class="section-container login-card">
    <h2 class="arcade-title">Entrar</h2>
    <p class="login-instruction">Acesse sua conta para apostar</p>
    
    @if (errorMessage) {
      <div class="alert-arcade">{{ errorMessage }}</div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="arcade-form">
      <div class="form-group">
        <label for="login">E-mail ou Nome de Usuário</label>
        <input 
          id="login" 
          type="text" 
          formControlName="login" 
          placeholder="Digite seu e-mail ou usuário" 
          class="arcade-input"
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="Digite sua senha" 
          class="arcade-input"
        />
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-arcade btn-main-action btn-full">
        Entrar na conta
      </button>
    </form>
    
    <p class="footer-link">
      Ainda não tem uma conta? <a routerLink="/register" class="neon-link">Cadastre-se agora</a>
    </p>
  </div>

  <p class="disclaimer">
      Simulador Educacional - Não envolve dinheiro real
  </p>
</div>
