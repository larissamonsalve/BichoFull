<div class="login-container">
  <h2>Entrar </h2>
  
  @if (errorMessage) {
    <div class="alert">{{ errorMessage }}</div>
  }

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="login">E-mail ou Nome de Usuário</label>
      <input id="login" type="text" formControlName="login" placeholder="Digite seu e-mail ou usuário" />
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password" placeholder="Sua senha secreta" />
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
  </form>
  
  <p>Ainda não tem conta? <a routerLink="/register">Cadastre-se</a></p>
</div>
